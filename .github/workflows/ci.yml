name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an older run of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code
permissions:
  contents: read

jobs:
  # ── Linux: every Ruby version, one after another ──────────────────────────
  linux-ruby-3-2:
    name: Linux · Ruby 3.2
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rspec
        with:
          ruby-version: "3.2"

  linux-ruby-3-3:
    name: Linux · Ruby 3.3
    needs: linux-ruby-3-2
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rspec
        with:
          ruby-version: "3.3"

  linux-ruby-3-4:
    name: Linux · Ruby 3.4
    needs: linux-ruby-3-3
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rspec
        with:
          ruby-version: "3.4"

  # ── Windows and macOS: start after Linux passes, run side by side ─────────
  windows-ruby-3-4:
    name: Windows · Ruby 3.4
    needs: linux-ruby-3-4
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rspec
        with:
          ruby-version: "3.4"

  macos-ruby-3-4:
    name: macOS · Ruby 3.4
    needs: windows-ruby-3-4
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rspec
        with:
          ruby-version: "3.4"

  # ── Build, analysis, final gate ───────────────────────────────────────────
  build:
    name: Build gem
    needs: [windows-ruby-3-4, macos-ruby-3-4]   # starts only after every spec job passes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build gem (checks the gemspec and file list)
        run: |
          gem build respondo.gemspec
          ruby -rrubygems/package -e 'puts Gem::Package.new(Dir["*.gem"].first).contents.sort'

  sonar:
    name: SonarQube analysis
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run specs to produce coverage
        run: bundle exec rspec --format progress

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # One stable check name to mark as "required" in the ruleset
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - linux-ruby-3-2
      - linux-ruby-3-3
      - linux-ruby-3-4
      - windows-ruby-3-4
      - macos-ruby-3-4
      - build
      - sonar
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if any job failed, was skipped or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more jobs did not succeed"
          exit 1

      - name: All jobs passed
        run: echo "All jobs passed"