name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an older run of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code
permissions:
  contents: read

jobs:
  ci:
    uses: spatelpatidar/ruby-ci-workflow/.github/workflows/ci.yml@v1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
