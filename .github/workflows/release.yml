name: Release

# Automatic: runs after the "CI" workflow finishes successfully on a push to main,
#            then releases the version defined in respondo.gemspec.
#            - 3.1.0.beta1 / 3.1.0.rc1  -> GitHub "Pre-release"
#            - 3.1.0                    -> normal (latest) release
#            Release notes come from the matching section in CHANGELOG.md.
# Manual:    Actions -> Release -> Run workflow. Tick "recreate" to delete the
#            existing tag + release for this version and create them again.
# Does NOT publish to RubyGems: run `gem push respondo-X.Y.Z.gem` yourself.
# All the logic lives in spatelpatidar/ruby-ci-workflow.
on:
  workflow_run:
    workflows: ["CI"]          # must match the `name:` in ci.yml exactly
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recreate:
        description: "Delete the existing tag/release for this version and create it again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: spatelpatidar/ruby-ci-workflow/.github/workflows/release.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      recreate: ${{ inputs.recreate || false }}
