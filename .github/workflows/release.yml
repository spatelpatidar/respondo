name: Release

# Creates a GitHub Release with the built .gem file attached when a version tag
# is pushed. It does NOT publish to RubyGems: push the gem manually from your
# machine with `gem push respondo-X.Y.Z.gem`.
#
# Usage:
#   git tag v3.0.0
#   git push origin v3.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Tag must match lib/respondo/version.rb
        run: |
          version="$(ruby -r ./lib/respondo/version -e 'puts Respondo::VERSION')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Run the test suite
        run: bundle exec rspec

      - name: Build the gem
        run: gem build respondo.gemspec

      - name: Create GitHub Release with the gem attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "respondo-${VERSION}.gem" \
            --title "respondo ${VERSION}" \
            --generate-notes \
            --verify-tag